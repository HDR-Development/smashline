name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: wuboyth/skyline-plugin-builder:latest
    outputs:
      version: ${{ steps.plugin-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Get Plugin Version
        id: plugin-version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build Release NRO
        run: cargo skyline build --release
        env:
          HOME: /root
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: smashline_plugin
          path: target/aarch64-skyline-switch/release/libsmashline_plugin.nro
          if-no-files-found: error

  upload:
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download Plugin Artifact
        uses: actions/download-artifact@v8
        with:
          name: smashline_plugin
      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Full release of the latest version. DO NOT PUBLISH UNTIL THIS BODY HAS BEEN UPDATED.

            ## Installation

            Place libsmashline_plugin.nro into SD://atmosphere/contents/01006A800016E000/romfs/skyline/plugins/
          files: libsmashline_plugin.nro
